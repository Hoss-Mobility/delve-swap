name: CI
on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repo; release.yml grants itself write where needed.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # verifyPlugin downloads two full GoLand IDEs (261 + 262) plus the
      # platform SDK and ~1.5 GB of plugin dependencies, which overruns the
      # default runner disk. Reclaim the preinstalled toolchains we don't use.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Non-GitHub-owned actions are pinned to a commit SHA so a compromised or
      # moved tag can't inject code into a secret-bearing job.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # The wrapper (not the runner's preinstalled Gradle) so CI builds with the
      # same pinned Gradle version as local builds.
      - run: ./gradlew --no-daemon test buildPlugin verifyPlugin
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: plugin-zip
          path: build/distributions/*.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verifier-report
          path: build/reports/pluginVerifier/**

name: CI
on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repo; release.yml grants itself write where needed.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # verifyPlugin downloads three full GoLand IDEs (261, 262 + 263) plus the
      # platform SDK and ~1.5 GB of plugin dependencies, which overruns the
      # default runner disk. Reclaim the preinstalled toolchains we don't use.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # Non-GitHub-owned actions are pinned to a commit SHA so a compromised or
      # moved tag can't inject code into a secret-bearing job.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      # The wrapper (not the runner's preinstalled Gradle) so CI builds with the
      # same pinned Gradle version as local builds.
      - run: ./gradlew --no-daemon test buildPlugin verifyPlugin
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: plugin-zip
          path: build/distributions/*.zip
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: verifier-report
          path: build/reports/pluginVerifier/**
